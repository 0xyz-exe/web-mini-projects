<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #ffffff;
      --bg-secondary: #f9fafb;
      --text: #111827;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --bg-secondary: #1f2937;
      --text: #f9fafb;
      --text-secondary: #9ca3af;
      --border: #374151;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .toolbar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .input, select {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .input { flex: 1; min-width: 250px; }
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 500;
      cursor: pointer;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
    }
    .gallery-item:hover {
      transform: translateY(-4px);
    }
    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .item-info {
      padding: 1rem;
    }
    .item-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-category {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .delete-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .gallery-item:hover .delete-btn {
      opacity: 1;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      color: var(--text-secondary);
      font-size: 1.2rem;
    }
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .lightbox.active { display: flex; }
    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
      position: relative;
    }
    .lightbox-content img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }
    .lightbox-title {
      color: white;
      text-align: center;
      margin-top: 1rem;
      font-size: 1.2rem;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 2rem;
      padding: 1rem;
      cursor: pointer;
      border-radius: 4px;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.3); }
    .lightbox-prev { left: -60px; }
    .lightbox-next { right: -60px; }
    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🖼️ Image Gallery</h1>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </header>
    <div class="toolbar">
      <input type="text" id="searchInput" class="input" placeholder="Search images...">
      <select id="categoryFilter" class="input">
        <option value="all">All Categories</option>
      </select>
      <button id="uploadBtn" class="btn">📤 Upload Images</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    <div id="gallery" class="gallery"></div>
  </div>

  <div id="lightbox" class="lightbox">
    <button id="closeLightbox" class="lightbox-close">✕</button>
    <div class="lightbox-content">
      <button id="prevBtn" class="lightbox-nav lightbox-prev">‹</button>
      <img id="lightboxImg" src="" alt="">
      <button id="nextBtn" class="lightbox-nav lightbox-next">›</button>
      <div id="lightboxTitle" class="lightbox-title"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
