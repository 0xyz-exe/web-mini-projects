<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Suite</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #ffffff;
      --bg-secondary: #f9fafb;
      --text: #111827;
      --border: #e5e7eb;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --bg-secondary: #1f2937;
      --text: #f9fafb;
      --border: #374151;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 400px; width: 100%; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .calculator {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .display {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      min-height: 80px;
    }
    .display-text {
      font-size: 2.5rem;
      text-align: right;
      word-wrap: break-word;
      font-variant-numeric: tabular-nums;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    .btn {
      padding: 1.5rem;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-operator {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .btn-clear {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
    }
    .btn-equals {
      grid-column: span 2;
      background: #10b981;
      color: white;
      border-color: #10b981;
    }
    @media (max-width: 500px) {
      .display-text { font-size: 2rem; }
      .btn { padding: 1.2rem; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔢 Calculator</h1>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </header>
    <div class="calculator">
      <div class="display">
        <div class="display-text" id="display">0</div>
      </div>
      <div class="buttons">
        <button class="btn btn-clear" data-action="clear">C</button>
        <button class="btn btn-operator" data-action="backspace">⌫</button>
        <button class="btn btn-operator" data-action="divide">÷</button>
        <button class="btn btn-operator" data-action="multiply">×</button>
        
        <button class="btn" data-num="7">7</button>
        <button class="btn" data-num="8">8</button>
        <button class="btn" data-num="9">9</button>
        <button class="btn btn-operator" data-action="subtract">−</button>
        
        <button class="btn" data-num="4">4</button>
        <button class="btn" data-num="5">5</button>
        <button class="btn" data-num="6">6</button>
        <button class="btn btn-operator" data-action="add">+</button>
        
        <button class="btn" data-num="1">1</button>
        <button class="btn" data-num="2">2</button>
        <button class="btn" data-num="3">3</button>
        <button class="btn btn-operator" data-action="percent">%</button>
        
        <button class="btn" data-num="0">0</button>
        <button class="btn" data-action="decimal">.</button>
        <button class="btn btn-equals" data-action="equals">=</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
