<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 Expense Tracker</h1>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </header>

    <div class="summary-cards">
      <div class="summary-card income">
        <div class="label">Income</div>
        <div class="amount" id="totalIncome">$0.00</div>
      </div>
      <div class="summary-card expense">
        <div class="label">Expenses</div>
        <div class="amount" id="totalExpense">$0.00</div>
      </div>
      <div class="summary-card balance">
        <div class="label">Balance</div>
        <div class="amount" id="balance">$0.00</div>
      </div>
    </div>

    <div class="chart-section">
      <h2>Spending by Category</h2>
      <div id="categoryChart" class="category-chart"></div>
    </div>

    <div class="add-transaction">
      <h2>Add Transaction</h2>
      <div class="form-grid">
        <input type="text" id="description" placeholder="Description" class="input">
        <input type="number" id="amount" placeholder="Amount" step="0.01" class="input">
        <select id="category" class="input">
          <option value="Food">🍔 Food</option>
          <option value="Transport">🚗 Transport</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Bills">💡 Bills</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Health">🏥 Health</option>
          <option value="Salary">💼 Salary</option>
          <option value="Other">📦 Other</option>
        </select>
        <select id="type" class="input">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <input type="date" id="date" class="input">
        <button id="addBtn" class="btn btn-primary">Add Transaction</button>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search transactions..." class="input">
      <select id="filterType" class="input">
        <option value="all">All</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <button id="exportBtn" class="btn btn-secondary">Export JSON</button>
      <button id="importBtn" class="btn btn-secondary">Import JSON</button>
      <button id="clearBtn" class="btn btn-danger">Clear All</button>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display:none">

    <div class="transactions-list">
      <h2>Transaction History</h2>
      <div id="transactionsList"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
