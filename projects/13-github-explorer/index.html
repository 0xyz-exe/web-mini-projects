<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Explorer</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #ffffff;
      --bg-secondary: #f9fafb;
      --text: #111827;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --bg-secondary: #1f2937;
      --text: #f9fafb;
      --text-secondary: #9ca3af;
      --border: #374151;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .search-section {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .btn {
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .error, .loading {
      padding: 1.5rem;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 2rem;
      display: none;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
    }
    .loading {
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }
    .profile {
      display: none;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .profile-header {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
    }
    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid var(--primary);
    }
    .profile-info {
      flex: 1;
    }
    .profile-name {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .profile-bio {
      color: var(--text-secondary);
      margin-bottom: 1rem;
      line-height: 1.6;
    }
    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .stat-item {
      background: var(--bg);
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary);
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .repos-section h2 {
      margin-bottom: 1rem;
    }
    .repos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .repo-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      transition: transform 0.2s;
    }
    .repo-card:hover {
      transform: translateY(-4px);
    }
    .repo-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }
    .repo-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .repo-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>😺 GitHub Explorer</h1>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </header>
    <div class="search-section">
      <input type="text" id="usernameInput" placeholder="Enter GitHub username..." class="input">
      <button id="searchBtn" class="btn">Search</button>
    </div>
    <div id="error" class="error"></div>
    <div id="loading" class="loading">Loading...</div>
    <div id="profile" class="profile">
      <div class="profile-header">
        <img id="avatar" class="avatar" alt="Avatar">
        <div class="profile-info">
          <h2 class="profile-name" id="name"></h2>
          <p id="username" style="color:var(--text-secondary);margin-bottom:1rem"></p>
          <p id="bio" class="profile-bio"></p>
          <div class="profile-stats">
            <div class="stat-item">
              <div class="stat-value" id="repos">0</div>
              <div class="stat-label">Repositories</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="followers">0</div>
              <div class="stat-label">Followers</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="following">0</div>
              <div class="stat-label">Following</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="reposSection" class="repos-section" style="display:none">
      <h2>Repositories</h2>
      <div id="reposGrid" class="repos-grid"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
